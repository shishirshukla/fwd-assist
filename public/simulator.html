<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forward Guard — Outlook add-in</title>
    <style>
      :root {
        --outlook-blue: #0f6cbd;
        --outlook-blue-hover: #115ea3;
        --bg: #f3f2f1;
        --border: #edebe9;
        --muted: #605e5c;
        --text: #201f1e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      header {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--outlook-blue);
        color: #fff;
        font-weight: 600;
      }
      header span.sub { font-weight: 400; font-size: 12px; opacity: 0.85; }
      .shell { display: flex; flex: 1; min-height: 0; }
      nav {
        width: 208px;
        background: #fff;
        border-right: 1px solid var(--border);
        padding: 12px;
      }
      nav p {
        margin: 0 8px 8px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      nav li { list-style: none; padding: 6px 8px; border-radius: 4px; }
      nav ul { margin: 0; padding: 0; }
      main { flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid transparent;
      }
      .btn { background: #fff; border-color: #d1d1d1; }
      .btn.active { background: #242424; color: #fff; border-color: #242424; }
      .send {
        background: var(--outlook-blue);
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .send:hover { background: var(--outlook-blue-hover); }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #e6e6e6;
      }
      .row { display: flex; flex: 1; min-height: 0; gap: 12px; }
      .compose {
        flex: 1;
        min-width: 0;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      .ribbon {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #faf9f8;
        border-bottom: 1px solid var(--border);
      }
      .hint { font-size: 12px; color: var(--muted); }
      .field {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .field span { width: 56px; color: var(--muted); }
      .field input, textarea {
        flex: 1;
        border: 0;
        outline: none;
        font: inherit;
        width: 100%;
        background: transparent;
      }
      textarea { min-height: 180px; padding: 12px 16px; resize: none; line-height: 1.5; }
      .status { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 14px; min-height: 44px; }
      .warn { color: #8a3707; }
      .ok { color: #0e7c3a; }
      .err { color: #c50f1f; }
      aside {
        width: 288px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      aside h2 { margin: 0 0 4px; font-size: 14px; }
      aside p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
      label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 4px; }
      .group { margin-bottom: 12px; }
      select, input[type="date"] {
        width: 100%;
        height: 32px;
        border: 1px solid #d1d1d1;
        border-radius: 8px;
        padding: 0 8px;
        font: inherit;
      }
      .field-error { color: #c50f1f; font-size: 12px; margin-top: 4px; min-height: 16px; }
      #save { width: 100%; background: #242424; color: #fff; }
      .hidden { display: none; }
      @media (max-width: 800px) {
        nav { display: none; }
        .row { flex-direction: column; }
        aside { width: 100%; }
        header span.sub { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      Forward Guard
      <span class="sub">Outlook Web add-in preview</span>
      <a href="/captures" target="_parent" style="margin-left:auto;color:#fff;font-weight:500;font-size:13px;">Captures</a>
      <a href="/logs" target="_parent" style="color:#fff;font-weight:500;font-size:13px;">Logs</a>
    </header>
    <div class="shell">
      <nav>
        <p>Folders</p>
        <ul>
          <li>Inbox</li>
          <li>Sent Items</li>
          <li>Drafts</li>
        </ul>
      </nav>
      <main>
        <div class="toolbar">
          <button type="button" class="btn active" id="load-forward">Load forwarded email</button>
          <button type="button" class="btn" id="load-new">Load new email</button>
          <span class="badge" id="mode-badge">Forward detected</span>
        </div>
        <div class="row">
          <section class="compose">
            <div class="ribbon">
              <button type="button" class="send" id="send">Send</button>
              <span class="hint">On Send, a forward is captured and posted to the letter API. Send is not blocked.</span>
            </div>
            <label class="field">
              <span>From</span>
              <input id="from" placeholder="Your address" value="you@contoso.com" autocomplete="off" />
            </label>
            <label class="field">
              <span>To</span>
              <input id="to" placeholder="Add recipients" value="legal@contoso.com" autocomplete="off" />
            </label>
            <label class="field">
              <span>Cc</span>
              <input id="cc" placeholder="Add Cc" value="records@contoso.com" autocomplete="off" />
            </label>
            <label class="field">
              <span>Subject</span>
              <input id="subject" placeholder="Subject" value="FW: Q3 vendor contract" />
            </label>
            <textarea id="body" placeholder="Write your message"></textarea>
            <div class="status" id="status"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="capture.js"></script>
    <script>
      const ORIGINAL = `---------- Forwarded message ---------
From: Alex Chen <alex.chen@contoso.com>
Sent: Monday, September 7, 2026 4:12 PM
To: you@contoso.com
Subject: Q3 vendor contract

Please review the attached vendor terms before Friday.`;

      const state = {
        mode: "forward",
      };

      const els = {
        to: document.getElementById("to"),
        from: document.getElementById("from"),
        cc: document.getElementById("cc"),
        subject: document.getElementById("subject"),
        body: document.getElementById("body"),
        status: document.getElementById("status"),
        badge: document.getElementById("mode-badge"),
        loadForward: document.getElementById("load-forward"),
        loadNew: document.getElementById("load-new"),
      };

      function isForwarded() {
        return state.mode === "forward" || /^(fw|fwd)\s*:/i.test(els.subject.value.trim());
      }

      function setStatus(text, kind) {
        els.status.className = "status " + (kind || "");
        els.status.textContent = text;
      }

      function refreshBadge() {
        if (isForwarded()) {
          els.badge.textContent = "Forward detected";
        } else {
          els.badge.textContent = "New message";
        }
      }

      function loadForward() {
        state.mode = "forward";
        els.to.value = "legal@contoso.com";
        els.from.value = "you@contoso.com";
        els.cc.value = "records@contoso.com";
        els.subject.value = "FW: Q3 vendor contract";
        els.body.value = "Hi Legal,\n\nPassing this along for review.\n\n" + ORIGINAL;
        els.loadForward.classList.add("active");
        els.loadNew.classList.remove("active");
        refreshBadge();
        setStatus("", "");
      }

      function loadNew() {
        state.mode = "new";
        els.to.value = "";
        els.from.value = "you@contoso.com";
        els.cc.value = "";
        els.subject.value = "";
        els.body.value = "";
        els.loadNew.classList.add("active");
        els.loadForward.classList.remove("active");
        refreshBadge();
        setStatus("", "");
      }

      function markSent(forwarded) {
        if (forwarded) {
          setStatus("Forward captured and sent. Letter details were posted to the API.", "ok");
          return;
        }
        setStatus("Sent. This was not a forwarded message, so nothing was captured.", "ok");
      }

      function send() {
        if (!els.to.value.trim()) {
          setStatus("Add at least one recipient before sending.", "err");
          return;
        }
        if (!isForwarded()) {
          markSent(false);
          return;
        }

        const parsed = window.ForwardGuardCapture
          ? ForwardGuardCapture.parseOriginalFromBody(els.body.value)
          : { originalEmailDate: "", senderName: "", senderEmailId: "", originalToEmailAddresses: [] };

        function finish() {
          markSent(true);
        }

        if (window.ForwardGuardCapture) {
          ForwardGuardCapture.post(
            {
              originalEmailDate: parsed.originalEmailDate,
              senderEmailId: parsed.senderEmailId,
              senderName: parsed.senderName,
              subject: els.subject.value,
              messageBody: els.body.value,
              toEmailAddresses: ForwardGuardCapture.splitAddresses(els.to.value),
              ccEmailAddresses: ForwardGuardCapture.splitAddresses(els.cc.value),
              originalToEmailAddresses: parsed.originalToEmailAddresses,
              forwardedByEmail: els.from.value,
            },
            finish,
          );
          return;
        }

        finish();
      }

      document.getElementById("send").addEventListener("click", send);
      els.loadForward.addEventListener("click", loadForward);
      els.loadNew.addEventListener("click", loadNew);
      els.subject.addEventListener("input", refreshBadge);

      loadForward();
    </script>
  </body>
</html>
